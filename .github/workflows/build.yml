name: Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          # For Linux and macOS, keep the compiler settings
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
          # For Windows, don't specify compiler directly
          - os: windows-latest
            generator: "Visual Studio 17 2022"

    env:
      # Only set CC/CXX for non-Windows platforms
      CC: ${{ contains(matrix.os, 'windows') && '' || matrix.cc }}
      CXX: ${{ contains(matrix.os, 'windows') && '' || matrix.cxx }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.23'

      # Use Ninja for Linux and macOS, but Visual Studio generator for Windows
      - name: Setup Ninja
        if: matrix.os != 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@v4
        with:
          version: '1.11.1'

      # Setup Visual Studio environment for Windows
      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache CPM
        uses: actions/cache@v4
        with:
          path: ./.cmake/CPM_*
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/cmake/CPMRecipe_*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Cache LibTorch
        uses: actions/cache@v4
        with:
          path: libtorch
          key: ${{ runner.os }}-libtorch-2.0.1-${{ matrix.build_type }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libopencv-dev libgl1-mesa-dev xorg-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update && brew install opencv@4 eigen glm

      # Note: For Windows, you may need to find alternative ways to install dependencies
      # that were previously installed via vcpkg (glm, eigen3)

      # Use different configure commands for Windows vs. Linux/macOS
      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p build
          cd build
          cmake .. -G "${{ matrix.generator }}" ^
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
            -DUSE_OPENCV=OFF ^
            -DUSE_TORCH=OFF ^
            -DUSE_PYBIND=OFF ^
            -DUSE_CCACHE=OFF
        shell: cmd

      - name: Configure CMake (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_OPENCV=OFF \
            -DUSE_TORCH=OFF \
            -DUSE_PYBIND=OFF \
            -DUSE_CCACHE=ON
        shell: bash

      # Build commands are different for Windows vs. Linux/macOS
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          cmake --build . --config ${{ matrix.build_type }} --parallel
        shell: cmd

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd build
          cmake --build . --config ${{ matrix.build_type }} --parallel
        shell: bash

      # Test commands are different for Windows vs. Linux/macOS
      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          ctest -C ${{ matrix.build_type }} --output-on-failure
        shell: cmd

      - name: Run tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd build
          ctest -C ${{ matrix.build_type }} --output-on-failure
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slrbs-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/slrbs*
            build/*/slrbs*
            build/*/*/slrbs*
          if-no-files-found: ignore