name: Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          # Linux uses GCC/G++
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          # macOS uses Clang/Clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
          # Windows will pick VS2022 by generator
          - os: windows-latest
            generator: "Visual Studio 17 2022"

    env:
      # Only set CC/CXX for non-Windows
      CC: ${{ matrix.os == 'windows-latest' && '' || matrix.cc }}
      CXX: ${{ matrix.os == 'windows-latest' && '' || matrix.cxx }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.23'

      - name: Setup Ninja (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@v4
        with:
          version: '1.11.1'

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Cache CPM
        uses: actions/cache@v4
        with:
          path: ./.cmake/CPM_*
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/cmake/CPMRecipe_*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Cache LibTorch
        uses: actions/cache@v4
        with:
          path: libtorch
          key: ${{ runner.os }}-libtorch-2.0.1-${{ matrix.build_type }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopencv-dev libgl1-mesa-dev xorg-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install opencv@4 eigen glm libomp

      # ───────────────────────────────────────────────────────────
      # Configure for Windows
      # ───────────────────────────────────────────────────────────
      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir build && cd build
          cmake .. -G "${{ matrix.generator }}" ^
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
            -DUSE_OPENCV=OFF ^
            -DUSE_TORCH=OFF ^
            -DUSE_PYBIND=OFF ^
            -DUSE_CCACHE=OFF
        shell: cmd

      # ───────────────────────────────────────────────────────────
      # Configure for Ubuntu
      # ───────────────────────────────────────────────────────────
      - name: Configure CMake (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_OPENCV=OFF \
            -DUSE_TORCH=OFF \
            -DUSE_PYBIND=OFF \
            -DUSE_CCACHE=ON
        shell: bash

      # ───────────────────────────────────────────────────────────
      # Configure for macOS (with OpenMP and no AVX2)
      # ───────────────────────────────────────────────────────────
      - name: Configure CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # point CMake at Homebrew’s libomp
          export LDFLAGS="-L$(brew --prefix libomp)/lib"
          export CPPFLAGS="-I$(brew --prefix libomp)/include"

          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_OPENCV=OFF \
            -DUSE_TORCH=OFF \
            -DUSE_PYBIND=OFF \
            -DUSE_CCACHE=ON \
            -DUSE_OPENMP=ON \
            -DUSE_SIMD_INTRINSICS=OFF
        shell: bash

      # ───────────────────────────────────────────────────────────
      # Build
      # ───────────────────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          cmake --build . --config ${{ matrix.build_type }} --parallel
        shell: cmd

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd build
          cmake --build . --config ${{ matrix.build_type }} --parallel
        shell: bash

      # ───────────────────────────────────────────────────────────
      # Test
      # ───────────────────────────────────────────────────────────
      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          ctest -C ${{ matrix.build_type }} --output-on-failure
        shell: cmd

      - name: Run tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd build
          ctest -C ${{ matrix.build_type }} --output-on-failure
        shell: bash

      # ───────────────────────────────────────────────────────────
      # Upload artifact
      # ───────────────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slrbs-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/slrbs*
            build/*/slrbs*
            build/*/*/slrbs*
          if-no-files-found: ignore
